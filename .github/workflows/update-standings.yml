name: Update standings

on:
  schedule:
    # Twice a week — Mondays and Thursdays, 06:00 UTC. Adjust to taste; see README.
    - cron: '0 6 * * 1,4'
  workflow_dispatch: {}   # <- this is the real "refresh button": Actions tab → this
                          #    workflow → "Run workflow". Anyone with write access
                          #    to the repo can click it on demand.

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install scraper dependencies
        working-directory: scraper
        run: npm install

      - name: Run fixture test (fails the build if the parser breaks)
        working-directory: scraper
        run: node fixture.test.mjs

      - name: Fetch current standings
        working-directory: scraper
        run: node fetch-standings.mjs

      - name: Commit changes if anything updated
        run: |
          git config user.name "pyramid-tracker-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/standings.json
          if git diff --cached --quiet; then
            echo "No changes to standings — nothing to commit."
          else
            git commit -m "Auto-update standings ($(date -u +%Y-%m-%d))"
            git push
          fi
